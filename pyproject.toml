[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqmail-readonly-viewer"
version = "1.3.0"
description = "A local, read-only multi-account IMAP mail viewer for macOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "nh3>=0.2.18",
  "Pillow>=10",
  "tinycss2>=1.2",
  "keyring>=25; sys_platform == 'win32'",
]
license = { text = "MIT" }
authors = [{ name = "Ke0830" }]
keywords = ["imap", "email", "gmail", "icloud", "qqmail", "macos", "windows", "readonly"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email :: Email Clients (MUA)",
]

[project.scripts]
qqmail-viewer = "qqmail_viewer:main"

[tool.setuptools]
py-modules = ["qqmail_viewer", "mail_cache", "mail_html", "mail_images", "mail_mime", "mail_sync", "mail_translation"]
